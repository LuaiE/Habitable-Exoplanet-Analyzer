name: Update NASA data

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python fetch_data.py
          python habitable.py
          python monte_carlo.py
          python plots.py

      - name: Run tests
        run: pytest

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/planets_mc.csv hz_diagram.png radius_diagram.png probability_ranking.png
          git diff --staged --quiet || git commit -m "Weekly NASA data update"
          git push
